<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hero Arena - Owner Edition</title>
    <!-- 引入 3D 渲染引擎 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; overflow: hidden; user-select: none; }
        
        /* 🏢 顶部 HUD 数据看板 */
        #game-hud { position: absolute; top: 15px; left: 15px; background: rgba(15, 23, 42, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #1e293b; z-index: 100; min-width: 250px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .hud-line { font-size: 1.05rem; margin-bottom: 6px; font-weight: bold; display: flex; justify-content: space-between; }
        .coin-txt { color: #f1c40f; }
        .score-txt { color: #00ff66; }
        .owner-badge { background: #f1c40f; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; font-weight: 900; display: none; }

        /* 🌐 控制面板 */
        #control-panel { position: absolute; top: 15px; right: 15px; z-index: 100; display: flex; gap: 10px; }
        .btn-ui { background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-ui:hover { background: #1d4ed8; transform: scale(1.05); }

        /* 🏆 全服独立资产排行榜 */
        #leaderboard { position: absolute; bottom: 20px; right: 20px; background: rgba(15, 23, 42, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #1e293b; z-index: 100; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .board-title { font-size: 1.1rem; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 6px; margin-bottom: 8px; font-weight: bold; text-align: center; }
        .player-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 4px 0; border-bottom: 1px solid #1e293b; }
        
        /* 💥 阵亡复活提示框 */
        #death-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(30, 41, 59, 0.95); padding: 30px; border-radius: 12px; border: 2px solid #ef4444; text-align: center; z-index: 200; display: none; box-shadow: 0 0 30px rgba(239,68,68,0.3); }
        #death-screen h2 { color: #ef4444; margin-top: 0; }

        /* 🔑 所有者秘籍浮层 */
        #owner-dialog { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.98); border: 2px solid #f1c40f; padding: 25px; border-radius: 10px; z-index: 300; display: none; text-align: center; box-shadow: 0 0 40px rgba(241,196,15,0.4); }
        #owner-dialog input { background: #0f172a; border: 1px solid #f1c40f; color: #fff; padding: 8px 12px; font-size: 1.2rem; text-align: center; border-radius: 4px; width: 180px; margin: 15px 0; outline: none; }
    </style>
</head>
<body>

    <!-- 🏢 个人数据看板 -->
    <div id="game-hud">
        <div class="hud-line">
            <span><span id="lbl-myname">我的英雄</span> <span id="owner-badge" class="owner-badge">👑 OWNER</span></span>
        </div>
        <div class="hud-line"><span id="lbl-myscore">击败数</span>: <span id="my-score" class="score-txt">0</span></div>
        <div class="hud-line"><span id="lbl-mymoney">钱包资产</span>: <span id="my-money" class="coin-txt">$0</span></div>
    </div>

    <!-- 🌐 功能面板 -->
    <div id="control-panel">
        <button class="btn-ui" onclick="toggleLanguage()">🌐 Switch Language / 切换语言</button>
    </div>

    <!-- 🏆 所有人独立的个人资产排行榜 -->
    <div id="leaderboard">
        <div class="board-title" id="lbl-boardtitle">全服独立资产排行榜</div>
        <div id="rank-rows"></div>
    </div>

    <!-- 💥 死亡弹窗 -->
    <div id="death-screen">
        <h2 id="lbl-deathtitle">你已被击败！</h2>
        <p id="lbl-deathdesc">钱包资产已妥善入库。</p>
        <button class="btn-ui" style="background:#ef4444;" onclick="respawnPlayer()" id="lbl-respawnbtn">重新进入战场</button>
    </div>

    <!-- 🔑 所有者密钥输入框 -->
    <div id="owner-dialog">
        <h3 style="color:#f1c40f; margin:0;" id="lbl-secret-title">👑 OWNER OVERRIDE SYSTEM</h3>
        <p style="font-size:0.9rem; color:#94a3b8; margin-top:5px;" id="lbl-secret-sub">Enter Secret Code:</p>
        <input type="password" id="secret-input" maxlength="10" placeholder="..." autofocus />
        <br>
        <button class="btn-ui" style="background:#f1c40f; color:#000;" onclick="submitSecretCode()">VERIFY</button>
        <button class="btn-ui" style="background:#475569;" onclick="closeSecretDialog()">CANCEL</button>
    </div>

    <script>
        const Localization = {
            zh: {
                myname: "玩家英雄 (你)",
                myscore: "击杀数",
                mymoney: "独立钱包",
                boardtitle: "🏆 全服独立资产排行榜",
                deathtitle: "💥 英雄已被击败！",
                deathdesc: "金币资产已妥善保存。",
                respawnbtn: "重新复活",
                secretTitle: "👑 所有者最高控制权限认证",
                secretSub: "请输入验证秘钥解锁神级特权："
            },
            en: {
                myname: "Player Hero (You)",
                myscore: "Kills",
                mymoney: "Independent Wallet",
                boardtitle: "🏆 Global Leaderboard",
                deathtitle: "💥 Hero Defeated!",
                deathdesc: "Wallet balance securely saved.",
                respawnbtn: "Respawn",
                secretTitle: "👑 OWNER OVERRIDE SYSTEM",
                secretSub: "Enter Secret Verification Code:"
            }
        };

        let currentLang = 'zh';
        const MAP_SIZE = 100;
        
        // 全局英雄实体（只有单独的角色，无蛇身）
        let entities = [
            { id: "player", name: "", x: 0, z: 0, hp: 100, kills: 0, money: 1500, isDead: false, color: 0x00ff66, isOwner: false },
            { id: "ai_1", name: "Colt_Bot", x: 20, z: 20, hp: 100, kills: 0, money: 820, isDead: false, color: 0x9b59b6, isOwner: false },
            { id: "ai_2", name: "Shelly_AI", x: -20, z: 20, hp: 100, kills: 0, money: 1240, isDead: false, color: 0xe67e22, isOwner: false },
            { id: "ai_3", name: "Spike_67", x: 20, z: -20, hp: 100, kills: 0, money: 3100, isDead: false, color: 0x34495e, isOwner: false },
            { id: "ai_4", name: "El_Primo", x: -20, z: -20, hp: 100, kills: 0, money: 450, isDead: false, color: 0xe74c3c, isOwner: false }
        ];

        let foods = []; // 金币/水果资源块
        let bullets = []; // 子弹列表
        let keysPressed = {};

        let scene, camera, renderer;
        let meshGroup = [];

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            let ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            let dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
            dirLight.position.set(0, 50, 0);
            scene.add(dirLight);

            let gridHelper = new THREE.GridHelper(MAP_SIZE, MAP_SIZE/2, 0x38bdf8, 0x1e293b);
            scene.add(gridHelper);

            // 初始化资源水晶
            for(let i=0; i<40; i++) {
                foods.push(createNewFood());
            }

            updateLanguageUI();

            window.addEventListener("keydown", e => {
                let key = e.key.toLowerCase();
                keysPressed[key] = true;
                if (key === 'o') openSecretDialog();
                if (key === ' ') fireBullet(entities.find(e => e.id === "player"));
            });
            window.addEventListener("keyup", e => keysPressed[e.key.toLowerCase()] = false);
            window.addEventListener("resize", onWindowResize);

            animateLoop();
        }

        function createNewFood() {
            return {
                x: (Math.random() - 0.5) * (MAP_SIZE - 10),
                z: (Math.random() - 0.5) * (MAP_SIZE - 10),
                moneyValue: Math.random() > 0.8 ? 100 : 20,
                color: Math.random() > 0.8 ? 0xf1c40f : 0x00ff66
            };
        }

        function openSecretDialog() {
            document.getElementById("owner-dialog").style.display = "block";
            let input = document.getElementById("secret-input");
            input.value = "";
            input.focus();
        }

        function closeSecretDialog() {
            document.getElementById("owner-dialog").style.display = "none";
        }

        function submitSecretCode() {
            let code = document.getElementById("secret-input").value.trim();
            if (code === "67") {
                let player = entities.find(e => e.id === "player");
                player.isOwner = true;
                player.money += 100000;
                player.color = 0xf1c40f; // 金色战甲

                document.getElementById("owner-badge").style.display = "inline-block";
                alert("👑 OWNER PRIVILEGES UNLOCKED!\n- Wallet: +$100,000\n- Invincible Golden Armor Activated!");
                closeSecretDialog();
                updateHUDAndLeaderboard();
            } else {
                alert("❌ Invalid Code.");
                closeSecretDialog();
            }
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'zh') ? 'en' : 'zh';
            updateLanguageUI();
        }

        function updateLanguageUI() {
            const dict = Localization[currentLang];
            entities.find(e => e.id === "player").name = dict.myname;

            document.getElementById("lbl-myname").innerText = dict.myname;
            document.getElementById("lbl-myscore").innerText = dict.myscore;
            document.getElementById("lbl-mymoney").innerText = dict.mymoney;
            document.getElementById("lbl-boardtitle").innerText = dict.boardtitle;
            document.getElementById("lbl-deathtitle").innerText = dict.deathtitle;
            document.getElementById("lbl-deathdesc").innerText = dict.deathdesc;
            document.getElementById("lbl-respawnbtn").innerText = dict.respawnbtn;
            document.getElementById("lbl-secret-title").innerText = dict.secretTitle;
            document.getElementById("lbl-secret-sub").innerText = dict.secretSub;
            
            updateHUDAndLeaderboard();
        }

        function fireBullet(entity) {
            if (!entity || entity.isDead) return;
            bullets.push({
                x: entity.x,
                z: entity.z,
                dx: (Math.random() - 0.5) * 0.8,
                dz: (Math.random() - 0.5) * 0.8,
                ownerId: entity.id,
                life: 60
            });
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);

            let player = entities.find(e => e.id === "player");
            if (!player.isDead) {
                let speed = 0.35;
                if (keysPressed['w'] || keysPressed['arrowup']) player.z -= speed;
                if (keysPressed['s'] || keysPressed['arrowdown']) player.z += speed;
                if (keysPressed['a'] || keysPressed['arrowleft']) player.x -= speed;
                if (keysPressed['d'] || keysPressed['arrowright']) player.x += speed;

                // 吃资源金币
                for (let i = foods.length - 1; i >= 0; i--) {
                    let f = foods[i];
                    let dx = player.x - f.x;
                    let dz = player.z - f.z;
                    if (dx*dx + dz*dz < 1.5) {
                        player.money += f.moneyValue;
                        foods.splice(i, 1);
                        foods.push(createNewFood());
                        updateHUDAndLeaderboard();
                    }
                }
            }

            // 相机视角锁定玩家
            if (!player.isDead) {
                camera.position.set(player.x, 25, player.z + 18);
                camera.lookAt(player.x, 0, player.z);
            }

            render3DSceneObjects();
        }

        function render3DSceneObjects() {
            meshGroup.forEach(mesh => scene.remove(mesh));
            meshGroup = [];

            // 渲染英雄角色（单个 Mesh，无蛇身）
            entities.forEach(entity => {
                if (entity.isDead) return;

                let geo = new THREE.CylinderGeometry(0.8, 0.8, 2, 16);
                let mat = new THREE.MeshStandardMaterial({
                    color: entity.color,
                    metalness: entity.isOwner ? 0.9 : 0.2
                });
                let mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(entity.x, 1, entity.z);
                scene.add(mesh);
                meshGroup.push(mesh);
            });

            // 渲染散落的水晶资源
            foods.forEach(f => {
                let geo = new THREE.OctahedronGeometry(0.5);
                let mat = new THREE.MeshStandardMaterial({ color: f.color, emissive: f.color, emissiveIntensity: 0.5 });
                let mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(f.x, 0.5, f.z);
                scene.add(mesh);
                meshGroup.push(mesh);
            });
        }

        function updateHUDAndLeaderboard() {
            let player = entities.find(e => e.id === "player");
            document.getElementById("my-score").innerText = player.kills;
            document.getElementById("my-money").innerText = `$${player.money}`;

            let sorted = [...entities].sort((a, b) => b.money - a.money);
            
            let html = "";
            sorted.forEach((item, index) => {
                let isMe = (item.id === "player");
                let colorStyle = isMe ? "color:#00ff66; font-weight:bold;" : "color:#fff;";
                let crown = item.isOwner ? "👑 " : "";
                html += `
                    <div class="player-row" style="${colorStyle}">
                        <span>${index + 1}. ${crown}${item.name}</span>
                        <span><b style="color:#00ff66;">Kills:${item.kills}</b> | <b style="color:#f1c40f;">$${item.money}</b></span>
                    </div>
                `;
            });
            document.getElementById("rank-rows").innerHTML = html;
        }

        function respawnPlayer() {
            let player = entities.find(e => e.id === "player");
            player.isDead = false;
            player.x = 0; player.z = 0;
            document.getElementById("death-screen").style.display = "none";
            updateHUDAndLeaderboard();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initGame;
    </script>
</body>
</html>
