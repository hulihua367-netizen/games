<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 67 矩阵：水果刷新版</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #050709; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; user-select: none; }
        #login-page { display: flex; flex-direction: column; align-items: center; background: #111418; padding: 40px; border-radius: 12px; border: 2px solid #676767; box-shadow: 0 0 30px rgba(0,255,100,0.2); width: 100%; max-width: 420px; text-align: center; box-sizing: border-box; z-index: 100; }
        h1 { color: #00ff66; font-size: 2.6rem; margin: 0 0 5px 0; text-shadow: 0 0 15px rgba(0,255,100,0.6); }
        .sub-title { font-size: 0.95rem; color: #aaa; margin-bottom: 30px; letter-spacing: 1px; }
        .btn-game { background-color: #00ff66; color: #000; border: none; padding: 16px 0; width: 100%; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,255,100,0.3); }
        .btn-game:hover { background-color: #00cc52; transform: scale(1.02); }
        
        #game-interface { display: none; flex-direction: row; gap: 20px; align-items: flex-start; position: relative; width: 95vw; height: 85vh; }
        #canvas-container { flex-grow: 1; height: 100%; border: 3px solid #1f272e; border-radius: 8px; position: relative; overflow: hidden; background: #000; }
        
        #kill-announcer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 255, 100, 0.9); color: #000; padding: 12px 30px; border-radius: 50px; font-weight: bold; font-size: 1.1rem; z-index: 100; box-shadow: 0 4px 15px rgba(0,255,100,0.4); display: none; text-align: center; min-width: 300px; }
        #death-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 9, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; display: none; z-index: 110; }
        
        #sidebar { background: #111418; width: 260px; padding: 20px; border-radius: 8px; border: 1px solid #1f272e; height: 100%; display: flex; flex-direction: column; box-sizing: border-box; }
        #status-indicator { position: absolute; top: 15px; left: 15px; padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; background: #e74c3c; font-weight: bold; z-index: 200; }
        
        .fruit-legend { font-size: 0.8rem; margin-top: 10px; background: #1a1a1a; padding: 8px; border-radius: 4px; border: 1px solid #333; }
        #refresh-timer { margin-top: 10px; font-size: 0.85rem; color: #00ff66; font-weight: bold; }
    </style>
</head>
<body>

    <div id="status-indicator">📡 连接 67 矩阵中...</div>

    <div id="login-page">
        <h1>3D 67 水果矩阵</h1>
        <div class="sub-title">[🍎支持 R 键手动刷新 · 67秒自动重组]</div>
        <input type="text" id="username-input" style="padding:14px; margin-bottom:20px; width:100%; box-sizing:border-box; background:#1a1a1a; color:#fff; border:1px solid #333; text-align:center; border-radius:6px;" placeholder="代号67" maxlength="8">
        <button class="btn-game" onclick="start3DGame()">开启矩阵</button>
    </div>

    <div id="game-interface">
        <div id="kill-announcer"></div>
        <div id="canvas-container">
            <div id="death-overlay">
                <h1 style="color:#e74c3c;">空间坍塌</h1>
                <p id="ui-death-score">积分: 0</p>
                <button class="btn-game" style="width:200px;" onclick="respawn3DPlayer()">重新凝聚</button>
            </div>
        </div>
        
        <div id="sidebar">
            <h3 style="margin:0; text-align:center; color:#00ff66;">🏆 67 英雄榜</h3>
            <div id="rank-list" style="overflow-y: auto; flex-grow: 1; margin: 10px 0;"></div>
            
            <div id="refresh-timer">⏳ 下次自动刷新: 67s</div>
            <button class="btn-game" style="font-size:0.9rem; padding:10px 0; margin-top:10px;" onclick="manualRefreshGems()">手动刷新水果 (R)</button>

            <div class="fruit-legend">
                <b style="color:#00ff66;">🍇 水果图鉴：</b><br>
                🍏 青苹果：+10 | 🍌 香蕉：+20<br>
                🍇 葡萄：+30 | ✨ 圣果：+67
            </div>
            
            <div style="font-size:0.7rem; color:#666; line-height:1.4; margin-top: 10px;">
                WASD 转向 | <b>R 刷新全场</b><br>
                全图严格 50 个静态水果
            </div>
        </div>
    </div>

    <script>
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        let TOPIC_GEMS = `ecoguardians/3drefresh67/gems`;
        let TOPIC_ALERTS = `ecoguardians/3drefresh67/alerts`;
        
        const GRID_SIZE = 30; 
        let mySnake = { body: [], dx: 1, dy: 0, score: 0 };
        let globalGems = [];
        let isDead = false;
        let activeBuff = "none";
        let gameLoopTimer = null;
        let autoRefreshCounter = 67;

        let scene, camera, renderer;
        let snakeMeshGroup = []; 
        let gemMeshGroup = [];   

        const FRUIT_TYPES = [
            { name: 'apple', color: 0x00ff66, score: 10, geom: 'box' },
            { name: 'banana', color: 0xffff00, score: 20, geom: 'cone' },
            { name: 'grape', color: 0x9b59b6, score: 30, geom: 'sphere' },
            { name: 'fruit67', color: 0xf1c40f, score: 67, geom: 'star' }
        ];

        client.on('connect', () => {
            document.getElementById("status-indicator").style.backgroundColor = "#00ff66";
            document.getElementById("status-indicator").innerText = "🟢 67号矩阵已锁定";
        });

        client.on('message', (topic, message) => {
            try {
                let data = JSON.parse(message.toString());
                if (topic === TOPIC_GEMS) { 
                    globalGems = data.gems || []; 
                    // 收到刷新指令时提示
                    if(data.reason === "refresh") showAnnouncement("🌀 水果矩阵已重新初始化！");
                }
                if (topic === TOPIC_ALERTS) { showAnnouncement(data.text); }
            } catch(e){}
        });

        function init3DScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050709);
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(GRID_SIZE / 2, 22, GRID_SIZE + 4);
            camera.lookAt(GRID_SIZE / 2, 0, GRID_SIZE / 2);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            let light = new THREE.DirectionalLight(0xffffff, 0.5);
            light.position.set(15, 30, 15);
            scene.add(light);
            let gh = new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0x1f272e, 0x111418);
            gh.position.set(GRID_SIZE/2-0.5, 0, GRID_SIZE/2-0.5);
            scene.add(gh);
            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            gemMeshGroup.forEach(mesh => {
                mesh.rotation.y += 0.03;
                mesh.position.y = 0.5 + Math.sin(Date.now() * 0.005 + mesh.position.x) * 0.1;
            });
            renderer.render(scene, camera);
        }

        function start3DGame() {
            document.getElementById("login-page").style.display = "none";
            document.getElementById("game-interface").style.display = "flex";
            init3DScene();
            client.subscribe(TOPIC_ALERTS);
            client.subscribe(TOPIC_GEMS);
            respawn3DPlayer();
            if(globalGems.length === 0) manualRefreshGems();
            
            // 启动 67 秒倒计时自动刷新器
            setInterval(() => {
                if(isDead) return;
                autoRefreshCounter--;
                document.getElementById("refresh-timer").innerText = `⏳ 下次自动刷新: ${autoRefreshCounter}s`;
                if(autoRefreshCounter <= 0) {
                    manualRefreshGems();
                    autoRefreshCounter = 67;
                }
            }, 1000);
        }

        // --- 核心刷新函数 ---
        function manualRefreshGems() {
            let newGems = [];
            for (let i = 0; i < 50; i++) { newGems.push(createNewRandomFruit()); }
            globalGems = newGems;
            // 通过 MQTT 同步全场，并标记为 refresh 动作
            client.publish(TOPIC_GEMS, JSON.stringify({ gems: globalGems, reason: "refresh" }));
            autoRefreshCounter = 67; // 重置计时器
        }

        function createNewRandomFruit() {
            let rand = Math.random();
            let config = FRUIT_TYPES[0];
            if (rand > 0.96) config = FRUIT_TYPES[3];
            else if (rand > 0.85) config = FRUIT_TYPES[2];
            else if (rand > 0.65) config = FRUIT_TYPES[1];
            return {
                x: Math.floor(Math.random() * GRID_SIZE),
                y: Math.floor(Math.random() * GRID_SIZE),
                fType: config.name,
                color: config.color,
                score: config.score
            };
        }

        function gameStep() {
            if (isDead) return;
            let head = { x: mySnake.body[0].x + mySnake.dx, y: mySnake.body[0].y + mySnake.dy };
            if (head.x < 0) head.x = GRID_SIZE - 1; if (head.x >= GRID_SIZE) head.x = 0;
            if (head.y < 0) head.y = GRID_SIZE - 1; if (head.y >= GRID_SIZE) head.y = 0;

            for (let i = 1; i < mySnake.body.length; i++) {
                if (head.x === mySnake.body[i].x && head.y === mySnake.body[i].y) { gameOver(); return; }
            }
            mySnake.body.unshift(head);
            let ate = false;
            for (let i = globalGems.length - 1; i >= 0; i--) {
                if (head.x === globalGems[i].x && head.y === globalGems[i].y) {
                    ate = true;
                    mySnake.score += globalGems[i].score;
                    globalGems.splice(i, 1);
                    globalGems.push(createNewRandomFruit()); // 吃一个补一个
                    client.publish(TOPIC_GEMS, JSON.stringify({ gems: globalGems }));
                    updateLeaderboard();
                    break;
                }
            }
            if (!ate) mySnake.body.pop();
            render3DObjects();
        }

        function render3DObjects() {
            snakeMeshGroup.forEach(m => scene.remove(m));
            snakeMeshGroup = [];
            mySnake.body.forEach((p, i) => {
                const geo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
                const mat = new THREE.MeshStandardMaterial({ color: i===0?0xffffff:0x00ff66, emissive: i===0?0xffffff:0x00ff66, emissiveIntensity: 0.2 });
                const m = new THREE.Mesh(geo, mat);
                m.position.set(p.x, 0.45, p.y);
                scene.add(m);
                snakeMeshGroup.push(m);
            });

            if (gemMeshGroup.length !== globalGems.length) {
                gemMeshGroup.forEach(m => scene.remove(m));
                gemMeshGroup = [];
                globalGems.forEach(g => {
                    let geo;
                    if(g.fType === 'banana') geo = new THREE.ConeGeometry(0.3, 0.7, 4);
                    else if(g.fType === 'grape') geo = new THREE.SphereGeometry(0.35, 8, 8);
                    else if(g.fType === 'fruit67') geo = new THREE.OctahedronGeometry(0.5);
                    else geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                    const mat = new THREE.MeshStandardMaterial({ color: g.color, emissive: g.color, emissiveIntensity: 0.4 });
                    const m = new THREE.Mesh(geo, mat);
                    m.position.set(g.x, 0.5, g.y);
                    scene.add(m);
                    gemMeshGroup.push(m);
                });
            }
        }

        function respawn3DPlayer() {
            isDead = false; mySnake.score = 0;
            document.getElementById("death-overlay").style.display = "none";
            mySnake.body = [{x:15,y:15},{x:14,y:15},{x:13,y:15}];
            mySnake.dx = 1; mySnake.dy = 0;
            if(gameLoopTimer) clearInterval(gameLoopTimer);
            gameLoopTimer = setInterval(gameStep, 120);
            updateLeaderboard();
        }

        function gameOver() { isDead = true; document.getElementById("ui-death-score").innerText = "最终积分: " + mySnake.score; document.getElementById("death-overlay").style.display = "flex"; }
        function showAnnouncement(m) { let b = document.getElementById("kill-announcer"); b.innerText = m; b.style.display = "block"; setTimeout(()=>b.style.display="none", 3000); }
        function updateLeaderboard() { document.getElementById("rank-list").innerHTML = `<div style="color:#00ff66; padding:10px; display:flex; justify-content:space-between;"><span>1. 玩家67</span><b>${mySnake.score}分</b></div>`; }

        window.addEventListener("keydown", e => {
            if (isDead) return;
            const k = e.key.toLowerCase();
            if (k === 'r') manualRefreshGems(); // 按下 R 键手动刷新
            if ((k === 'w' || e.key === 'ArrowUp') && mySnake.dy === 0) { mySnake.dx = 0; mySnake.dy = -1; }
            if ((k === 's' || e.key === 'ArrowDown') && mySnake.dy === 0) { mySnake.dx = 0; mySnake.dy = 1; }
            if ((k === 'a' || e.key === 'ArrowLeft') && mySnake.dx === 0) { mySnake.dx = -1; mySnake.dy = 0; }
            if ((k === 'd' || e.key === 'ArrowRight') && mySnake.dx === 0) { mySnake.dx = 1; mySnake.dy = 0; }
        });
    </script>
</body>
</html>
